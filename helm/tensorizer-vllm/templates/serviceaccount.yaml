{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tensorizer-vllm.serviceAccountName" . }}
  labels:
    {{- include "tensorizer-vllm.labels" . | nindent 4 }}
# No Role is bound to this account. The serving container talks to the model
# store and to callers, never to the API server, so it is granted nothing.
# k8s/rbac.yaml remains for deployments that do want the read-only pods
# get/list grant; point serviceAccount.name at it and set create: false.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}

name: build-and-deploy

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/${{ github.repository }}/vllm:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b4ffde82f28162d9a60b3dfb39e4f2447a3b1c7f
      - name: Set up Docker
        uses: docker/setup-buildx-action@f3821f4794d9a373d160d5e86f922b622d21b008
      - name: Set up kubectl
        uses: azure/setup-kubectl@bd24c49a951a6eb2de75e8b4785905a9a05fd85e
        with:
          version: v1.28.3
      - name: Set up Helm
        uses: azure/setup-helm@e9a68a7554547a8bb11e9a56ce3cfd31c8eaa974
        with:
          version: v3.12.3
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
      - name: Build
        # Tagged for the registry we authenticate against below. The previous
        # tag carried no registry prefix, so the push resolved to Docker Hub
        # rather than the ghcr.io login that precedes it.
        run: docker build -t "$IMAGE" .
      - name: Scan
        uses: aquasecurity/trivy-action@4d1a13b66e041b35769128a8b06845050806e06e
        with:
          image-ref: ${{ env.IMAGE }}
          # Blocking. Without exit-code the action reports findings and the job
          # carries on, so a critical CVE reached the registry and the cluster.
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          # A vulnerability with no available fix cannot be actioned by this
          # pipeline; it is reported by the scheduled scan instead of wedging
          # every deploy.
          ignore-unfixed: true
      - name: Login
        uses: docker/login-action@ee0af82ac35b689a7dce1aa3e9e4b0943aa53d25
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: docker push "$IMAGE"
      - name: Helm Upgrade
        run: |
          helm upgrade --install tensorizer helm/tensorizer-vllm \
            --set image="$IMAGE" \
            --namespace test \
            --create-namespace
